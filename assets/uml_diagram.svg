<text x="500" y="111" text-anchor="middle" font-size="18" font-weight="700">main()</text><text x="500" y="133" text-anchor="middle" class="small">program entry point</text>
<path d="M500 149 V190 H250 V220 M500 190 H750 V220" class="arrow"/>
<rect x="55" y="220" width="390" height="300" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="250" y="252" text-anchor="middle" font-size="19" font-weight="700">result_card_generator.py</text>
<text x="80" y="288" class="body">Constants: SUBJECTS, grade thresholds</text>
<text x="80" y="322" class="body">get_non_empty_text()</text><text x="80" y="352" class="body">get_roll_number() · get_mark()</text>
