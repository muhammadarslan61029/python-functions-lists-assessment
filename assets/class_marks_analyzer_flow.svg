<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930">
<rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.node{font-size:16px}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<text x="40" y="42" class="title">Class Marks Analyzer — Program Flow</text><rect x="220" y="68" width="560" height="48" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="500" y="98.0" text-anchor="middle" class="node">START</text><path d="M500 116 V144" class="arrow"/><rect x="220" y="150" width="560" height="48" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="180.0" text-anchor="middle" class="node">Read class size</text><path d="M500 198 V226" class="arrow"/><polygon points="500,232 900,263.0 500,294 100,263.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="500" y="269.0" text-anchor="middle" class="node">Validate positive whole-number count</text><path d="M500 294 V308" class="arrow"/><rect x="220" y="314" width="560" height="48" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="500" y="344.0" text-anchor="middle" class="node">Loop: read each student name and mark</text><path d="M500 362 V390" class="arrow"/><polygon points="500,396 900,427.0 500,458 100,427.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="500" y="433.0" text-anchor="middle" class="node">Validate name and mark from 0 to 100</text><path d="M500 458 V472" class="arrow"/><rect x="220" y="478" width="560" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="500" y="508.0" text-anchor="middle" class="node">Append student dictionary to the class list</text><path d="M500 526 V554" class="arrow"/><rect x="220" y="560" width="560" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="500" y="590.0" text-anchor="middle" class="node">Calculate average, highest/lowest and pass/fail counts</text><path d="M500 608 V636" class="arrow"/><rect x="220" y="642" width="560" height="48" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="500" y="672.0" text-anchor="middle" class="node">Filter above-average students; sort marks descending</text><path d="M500 690 V718" class="arrow"/><rect x="220" y="724" width="560" height="48" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="500" y="754.0" text-anchor="middle" class="node">Display class analysis report</text><path d="M500 772 V800" class="arrow"/><rect x="220" y="806" width="560" height="48" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="500" y="836.0" text-anchor="middle" class="node">END</text></svg>